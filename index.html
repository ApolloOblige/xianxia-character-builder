<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css"> 
  <title>Xianxia Character Builder</title>
</head>

<body>

  <h1>〔Xianxia Character Builder〕</h1>

  <section>
    <h2>〔Character Basics〕</h2>

    <label for="character-name">Character Name</label>
    <br>
    <input id="character-name" type="text" placeholder="Enter character name">

    <br><br>

    <label for="cultivation-path">Cultivation Path</label>
    <br>
    <select id="cultivation-path">
      <option>Righteous Path</option>
      <option>Demonic Path</option>
      <option>Beast / Plant Spirit Path</option>
      <option>Ghost Path</option>
    </select>
  </section>

</body>
</html>
