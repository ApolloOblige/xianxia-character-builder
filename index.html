<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create and save a xianxia character, with heritage bonuses, starting supplies and a character sheet.">
  <link rel="stylesheet" href="style.css">
  <script src="heritages.js" defer></script><script src="origins.js" defer></script>
  <script src="cultivation.js" defer></script>
  <script src="rules.js" defer></script><script src="app.js" defer></script>
  <title>Xianxia Character Builder</title>
</head>
<body>
  <header><p class="eyebrow">CHARACTER RECORD · D&D × MOTW</p><h1>〔Xianxia Character Builder〕</h1>
  <p>Build your character one step at a time. Return to any step to change a choice.</p></header>
  <div class="savebar"><span id="save-status" role="status">Your choices save in this browser.</span><button id="export">Download save</button><label class="file-button">Open save<input type="file" id="import" accept=".json,application/json"></label></div>
  <p id="notice" role="alert"></p><nav id="steps" aria-label="Character creation steps"></nav>
  <main id="panel"></main>
  <div class="navigation"><button id="back">Back</button><span id="progress"></span><button id="next" class="primary">Continue</button></div>
  <footer><p>Saved on this device and browser only. Download a save to keep a backup or move to another device.</p></footer>
  <noscript><p>This character builder needs JavaScript enabled to save choices and calculate totals.</p></noscript>
</body></html>
